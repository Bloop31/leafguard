name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

jobs:
  lint-and-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install lightweight dependencies
        run: pip install -r requirements.txt

      - name: Lint (flake8)
        run: flake8 src/ tests/ --max-line-length=110

      - name: Smoke tests (pytest, CPU-only, no torch needed)
        run: pytest tests/ -v
